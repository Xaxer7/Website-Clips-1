<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloads</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .download-btn {
            display: block;
            padding: 15px 20px;
            background-color: #007acc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        .download-btn:hover {
            background-color: #005999;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Downloads</h1>

        <div class="button-grid">
            <a href="video1.mp4" download class="download-btn">Video 1 herunterladen</a>
            <a href="video2.mp4" download class="download-btn">Video 2 herunterladen</a>
            <a href="video3.mp4" download class="download-btn">Video 3 herunterladen</a>
            <a href="video4.mp4" download class="download-btn">Video 4 herunterladen</a>
            
            <a href="video5.mp4" download class="download-btn">Video 5 herunterladen</a>
            <a href="video6.mp4" download class="download-btn">Video 6 herunterladen</a>
            <a href="video7.mp4" download class="download-btn">Video 7 herunterladen</a>
            <a href="video8.mp4" download class="download-btn">Video 8 herunterladen</a>
        </div>
    </div>

</body>
</html>
